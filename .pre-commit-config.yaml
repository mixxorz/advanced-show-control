repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        pass_filenames: false
        types: [rust]
        exclude: ^dev-tools/

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        pass_filenames: false
        types: [rust]
        exclude: ^dev-tools/

      - id: dev-tools-fmt
        name: dev-tools cargo fmt
        entry: cargo fmt --manifest-path dev-tools/Cargo.toml
        language: system
        pass_filenames: false
        files: ^dev-tools/.*\.rs$

      - id: dev-tools-clippy
        name: dev-tools cargo clippy
        entry: cargo clippy --manifest-path dev-tools/Cargo.toml --all-targets -- -D warnings
        language: system
        pass_filenames: false
        files: ^dev-tools/.*\.rs$
