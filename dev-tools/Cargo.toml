[package]
name = "advanced-show-control-dev-tools"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "lv1-probe"
path = "src/bin/lv1-probe.rs"

[[bin]]
name = "advanced-show-control-smoke"
path = "src/bin/advanced-show-control-smoke.rs"

[dependencies]
advanced-show-control = { path = "../app", features = ["debug-tools"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full", "test-util"] }
uuid = { version = "1.8", features = ["v4"] }
