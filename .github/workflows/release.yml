name: Release

on:
  push:
    tags:
      - "v[0-9]+"

permissions:
  contents: write

env:
  APP_NAME: Advanced Show Control

jobs:
  validate-release:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate tag and changelog
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+$ ]]; then
            echo "Tag '$tag' is not a build-number tag like v1" >&2
            exit 1
          fi
          if ! grep -Eq "^## \\[${tag}\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md is missing a section for ${tag}" >&2
            exit 1
          fi
          echo "release_tag=${tag}" >> "$GITHUB_OUTPUT"

  build-release-artifacts:
    name: Build release artifacts
    needs: validate-release
    uses: ./.github/workflows/build-release-artifacts.yml
    with:
      release_id: ${{ needs.validate-release.outputs.release_tag }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - validate-release
      - build-release-artifacts
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract release notes
        shell: bash
        run: |
          release_tag="${{ needs.validate-release.outputs.release_tag }}"
          awk -v release_tag="$release_tag" '
            $0 ~ "^## \\[" release_tag "\\] - " { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "No release notes found for ${release_tag}" >&2
            exit 1
          fi
          printf '\n---\n\nThe Windows artifact is unsigned. The macOS artifact is ad-hoc signed, not Developer ID signed or notarized.\n' >> release-notes.md

      - name: Download staged release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Advanced Show Control ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            dist/release/Advanced-Show-Control_${{ needs.validate-release.outputs.release_tag }}_Windows_x64.zip \
            dist/release/Advanced-Show-Control_${{ needs.validate-release.outputs.release_tag }}_macOS_universal.zip
