name: Build Release Artifacts

on:
  workflow_call:
    inputs:
      release_id:
        description: Identifier included in release asset names
        required: true
        type: string

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2

      - name: Build Windows archive
        shell: pwsh
        run: ./scripts/package-windows.ps1 -ReleaseId "${{ inputs.release_id }}"

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/release/Advanced-Show-Control_${{ inputs.release_id }}_Windows_x64.zip
          if-no-files-found: error

  build-macos:
    name: Build macOS universal
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2

      - name: Build macOS application archive
        run: ./scripts/package-macos.sh "${{ inputs.release_id }}"

      - name: Upload macOS release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/release/Advanced-Show-Control_${{ inputs.release_id }}_macOS_universal.zip
          if-no-files-found: error
