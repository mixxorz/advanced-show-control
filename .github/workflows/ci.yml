name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS native
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            dev-tools -> target

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Check formatting
        run: make fmt

      - name: Run Clippy
        run: make lint

      - name: Run tests
        run: make test

      - name: Build native binaries
        run: make build

      - name: Run native visual checks
        run: make visual-test

  windows:
    name: Windows native
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            dev-tools -> target

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Run app Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run app tests
        run: cargo nextest run --workspace

      - name: Build app
        run: cargo build --workspace

      - name: Run development-tool checks
        shell: pwsh
        run: |
          cargo clippy --manifest-path dev-tools/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo nextest run --manifest-path dev-tools/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --manifest-path dev-tools/Cargo.toml --all-targets
