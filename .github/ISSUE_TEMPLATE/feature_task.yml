name: Feature Or Task
description: Track implementation-sized feature, chore, docs, release, or testing work.
title: ""
labels:
  - "type: feature"
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What needs to be done?
    validations:
      required: true
  - type: input
    id: milestone
    attributes:
      label: Milestone
      description: Use the GitHub milestone that owns this work.
      placeholder: "MVP: Scene Fades + Cue Lists"
    validations:
      required: true
  - type: textarea
    id: problem-or-goal
    attributes:
      label: Problem Or Goal
      description: Why is this work needed?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in scope and out of scope for this issue?
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: What observable outcomes close this issue?
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: safety-impact
    attributes:
      label: Safety Impact
      description: State whether this touches LV1 state, scene recall, fade execution, fader writes, lockout, disconnect/reconnect handling, generation guards, stale state, or manual override behavior.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Testing And Verification
      description: List the expected test style or command, such as Rust unit, actor, smoke, Vitest, Storybook, visual, docs/template inspection, or GitHub verification.
    validations:
      required: true
  - type: textarea
    id: related-docs
    attributes:
      label: Related Docs Or Specs
      description: Link related specs, plans, docs, or issues.
    validations:
      required: false
